# PIPELINE PRINCIPAL DE CI/CD - AZURE PIPELINES
# Proyecto: IT Incident Hub (DevOps Integrador)
# Responsable: [DevOps Lead] Mayro Geovanni Barrios Gameros (AB#23, AB#30)
# ==============================================================

trigger:
  branches:
    include:
      - main

pool:
  # Puede ejecutarse en el Self-Hosted Agent local ('Default' / 'LocalPool') o en agente hosted
  name: 'Default'

variables:
  - group: incident-hub-secrets
  - name: BUILD_CONFIGURATION
    value: 'Release'

steps:
  # 1. Checkout del código fuente
  - checkout: self
    displayName: '1. Checkout de Código Fuente'

  # 2. Verificación de Entorno en Self-Hosted Agent y Variables Protegidas
  - script: |
      echo "=== Verificando entorno en Self-Hosted Agent ==="
      node -v
      npm -v
      echo "DB_HOST configurado: $(DB_HOST)"
      echo "DB_NAME configurado: $(DB_NAME)"
      echo "Secretos protegidos cargados desde Variable Group: incident-hub-secrets"
    displayName: '2. Verificar Self-Hosted Agent y Secretos Protegidos (AB#23, AB#27)'

  # 3. Instalación y Restauración de dependencias
  - script: |
      echo "=== Restaurando dependencias Backend ==="
      cd backend
      call npm install --no-audit --no-fund
    displayName: '3. Instalación / Restauración de Dependencias'

  # 4. Revisión de Dependencias y Seguridad (SCA)
  - script: |
      echo "=== Ejecutando Auditoría de Seguridad con npm audit ==="
      cd backend
      call npm audit --audit-level=high
    displayName: '4. Revisión de Dependencias y Seguridad (AB#27)'

  # 5. Ejecución de Pruebas Automatizadas
  - script: |
      echo "=== Ejecutando Suite de Pruebas Unitarias ==="
      cd tests
      node --test api.test.js
    displayName: '5. Ejecución de Pruebas Unitarias Automatizadas (AB#24)'

  # 6. Compilación y Build de Frontend React (Vite)
  - script: |
      echo "=== Compilando paquete de producción Frontend con Vite ==="
      cd frontend
      call npm install --no-audit --no-fund
      call npm run build
    displayName: '6. Compilación y Build de Frontend React (Vite)'

  # 7. Empaquetado de Artefactos
  - task: CopyFiles@2
    displayName: '7. Copiar Archivos al Directorio de Artefactos'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: |
        backend/package.json
        backend/server.js
        backend/src/**
        frontend/dist/**
        frontend/src/**
        database/**
        docs/**
        README.md
      TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'

  # 8. Publicación del Artefacto
  - task: PublishBuildArtifacts@1
    displayName: '8. Publicar Artefacto de Release incident-hub-drop (AB#30)'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
      ArtifactName: 'incident-hub-drop'
      publishLocation: 'Container'
