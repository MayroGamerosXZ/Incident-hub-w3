version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: incident-hub-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en su archivo .env}
      POSTGRES_DB: ${DB_NAME:-incident_hub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: incident-hub-backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-incident_hub_db}
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
    container_name: incident-hub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
